name: Tests

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        ruby-version: ['3.3', '3.4']

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: piggly
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: piggly
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U piggly"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      PGHOST: localhost
      PGUSER: piggly
      PGPASSWORD: secret
      PGDATABASE: piggly

    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby ${{ matrix.ruby-version }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true

      - name: Run tests
        run: bundle exec rake spec
